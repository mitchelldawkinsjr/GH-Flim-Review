server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Film Room Tagger shared store → PocketBase (internal only).
    # Served under /pb/api/ (not /api/) to avoid stale hub-cache entries, and
    # marked no-store so the reverse proxy never caches API responses.
    location /pb/api/ {
        proxy_pass http://flim-review-pocketbase:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE/realtime: don't buffer, allow long-lived streams
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
